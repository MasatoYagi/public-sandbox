<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad録画テスト（背面カメラ・自動DL）</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    /* 背面カメラの映像が見やすいように調整 */
    video { width: 100%; max-width: 400px; background: #000; border-radius: 8px; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
    #downloadLink {
      display: none; /* 初期状態は非表示 */
      padding: 10px 20px; background: #28a745; color: white;
      text-decoration: none; border-radius: 5px; margin-top: 10px;
      text-align: center; font-weight: bold;
    }
    .form-container { margin-top: 30px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; }
  </style>
</head>
<body>

  <h2>iPad 録画テスト（背面カメラ）</h2>

  <!-- カメラのプレビュー領域 -->
  <video id="preview" autoplay muted playsinline></video>
  <br>

  <!-- 録画のコントロールボタン -->
  <button id="startBtn">録画開始</button>
  <button id="stopBtn" disabled>録画停止</button>
  <br><br>

  <!-- ダウンロード用ボタン（自動DLが弾かれた時のための手動ボタン） -->
  <a id="downloadLink">👇 自動保存されない場合はここをタップ 👇</a>

  <!-- 送信用フォーム -->
  <div class="form-container">
    <h3>送信フォーム</h3>
    <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
      <label for="videoFile">添付された動画:</label><br>
      <input type="file" id="videoFile" name="video">
      <br><br>
      <button type="submit">フォーム送信</button>
    </form>
  </div>

  <script>
    let mediaRecorder;
    let recordedChunks = []; 

    const preview = document.getElementById('preview');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadLink = document.getElementById('downloadLink');
    const fileInput = document.getElementById('videoFile');

    // 【変更1】背面カメラ（environment）を指定して取得
    navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment" }, 
      audio: true 
    })
      .then(stream => {
        preview.srcObject = stream;
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
          if (event.data && event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = function() {
          const mimeType = mediaRecorder.mimeType || 'video/mp4';
          const blob = new Blob(recordedChunks, { type: mimeType });
          const fileName = `recording_${Date.now()}.mp4`;

          const downloadUrl = URL.createObjectURL(blob);
          downloadLink.href = downloadUrl;
          downloadLink.download = fileName;
          
          // ボタンを画面に表示しておく（iPadで自動DLがブロックされた時用）
          downloadLink.style.display = 'inline-block'; 

          // フォームの <input type="file"> へ自動添付
          const file = new File([blob], fileName, { type: mimeType });
          const dataTransfer = new DataTransfer();
          dataTransfer.items.add(file);
          fileInput.files = dataTransfer.files;

          // 【変更2】プログラムから自動的にクリックしてダウンロードを促す
          downloadLink.click();
        };
      })
      .catch(error => {
        alert("カメラの取得に失敗しました: " + error.message);
      });

    // 「録画開始」ボタン
    startBtn.onclick = () => {
      recordedChunks = []; 
      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      downloadLink.style.display = 'none'; 
    };

    // 「録画停止」ボタン
    stopBtn.onclick = () => {
      mediaRecorder.stop(); 
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };
  </script>

</body>
</html>
