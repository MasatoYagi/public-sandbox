<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF.js 注釈エディタテスト (モバイル完全対応版)</title>
    <!-- PDF.js viewer用の必須CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf_viewer.min.css">
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: sans-serif; 
            background: #f5f5f5;
        }
        .controls { 
            padding: 10px; 
            background: #ffffff; 
            border-bottom: 1px solid #ccc;
            z-index: 100;
            flex-shrink: 0;
        }
        .controls-row {
            margin-bottom: 8px;
        }
        button { 
            padding: 8px 12px; 
            margin-right: 5px; 
            margin-bottom: 5px; 
            cursor: pointer; 
        }
        #status { 
            font-weight: bold; 
            color: blue; 
            font-size: 0.9em;
        }
        /* Viewerコンテナの必須スタイル */
        .stagewrap { 
            position: relative; 
            flex: 1; 
            overflow: hidden; 
            background: #808080;
        }
        #viewerContainer { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            overflow: auto; 
        }
        
        /* 
         * ▼▼ モバイル操作改善用のCSS ▼▼
         */
        /* 常にエディタレイヤーをテキスト選択レイヤーより前面に出す */
        .pdfViewer .annotationEditorLayer {
            z-index: 10 !important;
        }
        .pdfViewer .textLayer {
            z-index: 1 !important;
        }
        
        /* ペンモード有効時：スクロールを完全に無効化して描画イベントを優先させる */
        .drawing-mode {
            touch-action: none !important;
            overflow: hidden !important; 
        }
        .drawing-mode .pdfViewer {
            touch-action: none !important;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="controls-row">
            <input type="file" id="fileInput" accept="application/pdf" />
        </div>
        <div class="controls-row">
            <button id="modeNone" disabled>閲覧・スクロール</button>
            <button id="modeInk" disabled>ペンで描く (赤)</button>
            <button id="saveBtn" disabled>保存・DL</button>
        </div>
        <div id="status">ファイルを選択してください</div>
    </div>

    <!-- PDF.jsのViewer部品をマウントするDOM -->
    <div class="stagewrap">
        <div id="viewerContainer">
            <div id="viewer" class="pdfViewer"></div>
        </div>
    </div>

    <!-- ESモジュールとしてPDF.jsを読み込む -->
    <script type="module">
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.mjs';
        import * as pdfjsViewer from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf_viewer.mjs';

        // ワーカーの設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.mjs';

        let currentPdf = null;
        let originalFileName = "";

        const statusEl = document.getElementById('status');
        const modeNoneBtn = document.getElementById('modeNone');
        const modeInkBtn = document.getElementById('modeInk');
        const saveBtn = document.getElementById('saveBtn');
        const viewerContainer = document.getElementById('viewerContainer');

        // ① EventBusとViewerの初期化
        const eventBus = new pdfjsViewer.EventBus();
        const viewer = new pdfjsViewer.PDFViewer({
            container: viewerContainer,
            eventBus: eventBus,
            // 0 (NONE) = エディタ層は有効化するが、初期状態はツール未選択
            annotationEditorMode: 0, 
        });

        // スケール調整（モバイルでの見切れ対策）
        // DOMの準備完了時と、実際のページロード完了時の両方で幅合わせを実行
        eventBus.on('pagesinit', () => {
            viewer.currentScaleValue = 'page-width'; 
        });
        eventBus.on('pagesloaded', () => {
            viewer.currentScaleValue = 'page-width'; 
        });

        // 画面回転時などのリサイズ対応
        window.addEventListener('resize', () => {
            if (viewer.currentScaleValue !== 'page-width') {
                viewer.currentScaleValue = 'page-width';
            }
        });

        // ② ファイル読み込みと表示
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            originalFileName = file.name;
            statusEl.textContent = "読み込み中...";
            
            const arrayBuffer = await file.arrayBuffer();
            
            try {
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                currentPdf = await loadingTask.promise;
                
                viewer.setDocument(currentPdf);
                
                statusEl.textContent = "準備完了";
                modeNoneBtn.disabled = false;
                modeInkBtn.disabled = false;
                saveBtn.disabled = false;
            } catch (error) {
                statusEl.textContent = "エラー: " + error.message;
            }
        });

        // ③ ツール切り替えとスクロール制御（モバイル対応）
        modeNoneBtn.addEventListener('click', () => {
            // スクロール可能にする
            viewerContainer.classList.remove('drawing-mode');
            eventBus.dispatch('switchannotationeditormode', { source: window, mode: 0 }); // 0: NONE
            statusEl.textContent = "モード: 閲覧・スクロール (描画不可)";
        });

        modeInkBtn.addEventListener('click', () => {
            // スクロールをロックして描画に専念させる
            viewerContainer.classList.add('drawing-mode');
            eventBus.dispatch('switchannotationeditormode', { source: window, mode: 15 }); // 15: INK
            
            // ペンの色や太さを指定
            eventBus.dispatch('switchannotationeditorparams', {
                source: window,
                type: 2, // INK_COLOR
                value: '#e0403a' // 赤色
            });
            eventBus.dispatch('switchannotationeditorparams', {
                source: window,
                type: 3, // INK_THICKNESS
                value: 4
            });
            statusEl.textContent = "モード: ペン (スクロールロック中)";
        });

        // ④ PDF.jsの標準機能で保存
        saveBtn.addEventListener('click', async () => {
            if (!currentPdf) return;
            statusEl.textContent = "保存処理中...";
            
            try {
                const bytes = await currentPdf.saveDocument();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'edited_' + originalFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                statusEl.textContent = "保存完了 (※続けて編集する場合は再読み込み推奨)";
            } catch (error) {
                statusEl.textContent = "保存エラー: " + error.message;
            }
        });
    </script>
</body>
</html>
