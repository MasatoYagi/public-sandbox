<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF.js 注釈エディタテスト (モバイル完全対応版 v6)</title>
    <!-- PDF.js viewer用の必須CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf_viewer.min.css">
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: sans-serif; 
            background: #f5f5f5;
            overscroll-behavior: none; 
            overflow: hidden; 
        }
        .controls { 
            padding: 10px; 
            background: #ffffff; 
            border-bottom: 1px solid #ccc;
            z-index: 100;
            flex-shrink: 0;
        }
        .controls-row {
            margin-bottom: 8px;
        }
        button { 
            padding: 8px 12px; 
            margin-right: 5px; 
            margin-bottom: 5px; 
            cursor: pointer; 
            font-weight: bold;
        }
        #status { 
            font-weight: bold; 
            color: blue; 
            font-size: 0.9em;
        }
        .stagewrap { 
            position: relative; 
            flex: 1; 
            overflow: hidden; 
            background: #808080;
        }
        #viewerContainer { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            overflow: auto; 
        }
        
        /* 描画モード時のスクロールとピンチズームを完全に防ぐ */
        .drawing-mode {
            touch-action: none !important;
        }
        .drawing-mode #viewerContainer {
            overflow: hidden !important; 
        }
        
        /* エディタレイヤーを常に最前面に */
        .pdfViewer .annotationEditorLayer {
            z-index: 10 !important;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="controls-row">
            <input type="file" id="fileInput" accept="application/pdf" />
        </div>
        <div class="controls-row">
            <button id="modeNone" disabled>閲覧・スクロール</button>
            <button id="modeInk" disabled>ペンで描く (赤色)</button>
            <button id="saveBtn" disabled>保存・DL</button>
        </div>
        <div id="status">ファイルを選択してください</div>
    </div>

    <!-- PDF.jsのViewer部品をマウントするDOM -->
    <div class="stagewrap">
        <div id="viewerContainer">
            <div id="viewer" class="pdfViewer"></div>
        </div>
    </div>

    <!-- ESモジュールとしてPDF.jsを読み込む -->
    <script type="module">
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.mjs';
        import * as pdfjsViewer from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf_viewer.mjs';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.mjs';

        const EDITOR_INK = pdfjsLib.AnnotationEditorType.INK; 
        const EDITOR_NONE = pdfjsLib.AnnotationEditorType.NONE; 

        let currentPdf = null;
        let originalFileName = "";

        const statusEl = document.getElementById('status');
        const modeNoneBtn = document.getElementById('modeNone');
        const modeInkBtn = document.getElementById('modeInk');
        const saveBtn = document.getElementById('saveBtn');
        const viewerContainer = document.getElementById('viewerContainer');
        const fileInput = document.getElementById('fileInput');

        fileInput.addEventListener('click', function() {
            this.value = '';
        });

        const eventBus = new pdfjsViewer.EventBus();

        // ★追加: 描画時のサイレントクラッシュを防ぐためのダミー言語設定
        const dummyL10n = {
            get: async (key, args, fallback) => fallback || key,
            has: async (key) => false,
            getLanguage: () => 'ja',
            getDirection: () => 'ltr',
            translate: async (element) => {}
        };

        const viewer = new pdfjsViewer.PDFViewer({
            container: viewerContainer,
            eventBus: eventBus,
            l10n: dummyL10n,                 // 必須：ツールチップ生成エラーの回避
            annotationEditorEnabled: true,   // 必須：エディタモジュールの明示的な有効化
            annotationEditorMode: EDITOR_NONE, 
            textLayerMode: 0,                // 必須：0(DISABLE)に設定し、テキストレイヤーのタッチ干渉を排除
        });

        // スケール調整
        eventBus.on('pagesinit', () => {
            viewer.currentScaleValue = 'page-width'; 
        });
        eventBus.on('pagerendered', (e) => {
            if (e.pageNumber === 1) {
                viewer.currentScaleValue = 'page-width';
            }
        });
        window.addEventListener('resize', () => {
            if (viewer.currentScaleValue !== 'page-width') {
                viewer.currentScaleValue = 'page-width';
            }
        });

        // ファイル読み込み処理
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            originalFileName = file.name;
            statusEl.textContent = "読み込み中...";
            
            const arrayBuffer = await file.arrayBuffer();
            
            try {
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                currentPdf = await loadingTask.promise;
                
                viewer.setDocument(currentPdf);
                
                statusEl.textContent = "準備完了";
                modeNoneBtn.disabled = false;
                modeInkBtn.disabled = false;
                saveBtn.disabled = false;
                
                modeNoneBtn.click();
            } catch (error) {
                statusEl.textContent = "エラー: " + error.message;
            }
        });

        // 閲覧モード
        modeNoneBtn.addEventListener('click', () => {
            viewerContainer.classList.remove('drawing-mode');
            eventBus.dispatch('switchannotationeditormode', { source: window, mode: EDITOR_NONE });
            statusEl.textContent = "モード: 閲覧・スクロール (描画不可)";
            modeNoneBtn.style.background = "#ddd";
            modeInkBtn.style.background = "";
        });

        // ペンモード
        modeInkBtn.addEventListener('click', () => {
            viewerContainer.classList.add('drawing-mode');
            eventBus.dispatch('switchannotationeditormode', { source: window, mode: EDITOR_INK }); 
            
            // ペンの色（赤）と太さ（4）
            eventBus.dispatch('switchannotationeditorparams', {
                source: window, type: 2, value: '#e0403a' // INK_COLOR
            });
            eventBus.dispatch('switchannotationeditorparams', {
                source: window, type: 3, value: 4         // INK_THICKNESS
            });
            
            statusEl.textContent = "モード: ペン描画中 (指でなぞってください)";
            modeInkBtn.style.background = "#ffcccc";
            modeNoneBtn.style.background = "";
        });

        // 保存ボタン
        saveBtn.addEventListener('click', async () => {
            if (!currentPdf) return;
            statusEl.textContent = "保存処理中...";
            
            try {
                const bytes = await currentPdf.saveDocument();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'edited_' + originalFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                statusEl.textContent = "保存完了 (※続けて編集する場合は再読み込み推奨)";
            } catch (error) {
                statusEl.textContent = "保存エラー: " + error.message;
            }
        });
    </script>
</body>
</html>
