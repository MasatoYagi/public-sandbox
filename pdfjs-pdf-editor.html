<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- 描画時の意図しない拡大縮小を防ぐため viewport を固定 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF.js 注釈エディタテスト (モバイル完全対応版 v2)</title>
    <!-- PDF.js viewer用の必須CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf_viewer.min.css">
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: sans-serif; 
            background: #f5f5f5;
            overscroll-behavior: none; /* スワイプによる戻る/進むを防止 */
        }
        .controls { 
            padding: 10px; 
            background: #ffffff; 
            border-bottom: 1px solid #ccc;
            z-index: 100;
            flex-shrink: 0;
        }
        .controls-row {
            margin-bottom: 8px;
        }
        button { 
            padding: 8px 12px; 
            margin-right: 5px; 
            margin-bottom: 5px; 
            cursor: pointer; 
        }
        #status { 
            font-weight: bold; 
            color: blue; 
            font-size: 0.9em;
        }
        /* Viewerコンテナの必須スタイル */
        .stagewrap { 
            position: relative; 
            flex: 1; 
            overflow: hidden; 
            background: #808080;
        }
        #viewerContainer { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            overflow-x: hidden; /* 横スクロール（見切れ）を強制的に隠す */
            overflow-y: auto; 
        }
        
        /* 常にエディタレイヤーをテキスト選択レイヤーより前面に出す */
        .pdfViewer .annotationEditorLayer {
            z-index: 10 !important;
        }
        .pdfViewer .textLayer {
            z-index: 1 !important;
        }
        
        /* ペンモード有効時：スクロールを完全に無効化して描画イベントを優先させる */
        .drawing-mode {
            touch-action: none !important;
            overflow-y: hidden !important; /* 縦スクロールもロック */
        }
        .drawing-mode .pdfViewer .page {
            touch-action: none !important;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="controls-row">
            <input type="file" id="fileInput" accept="application/pdf" />
        </div>
        <div class="controls-row">
            <button id="modeNone" disabled>閲覧・スクロール</button>
            <button id="modeInk" disabled>ペンで描く</button>
            <button id="saveBtn" disabled>保存・DL</button>
        </div>
        <div id="status">ファイルを選択してください</div>
    </div>

    <!-- PDF.jsのViewer部品をマウントするDOM -->
    <div class="stagewrap">
        <div id="viewerContainer">
            <div id="viewer" class="pdfViewer"></div>
        </div>
    </div>

    <!-- ESモジュールとしてPDF.jsを読み込む -->
    <script type="module">
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.mjs';
        import * as pdfjsViewer from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf_viewer.mjs';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.mjs';

        let currentPdf = null;
        let originalFileName = "";

        const statusEl = document.getElementById('status');
        const modeNoneBtn = document.getElementById('modeNone');
        const modeInkBtn = document.getElementById('modeInk');
        const saveBtn = document.getElementById('saveBtn');
        const viewerContainer = document.getElementById('viewerContainer');

        const eventBus = new pdfjsViewer.EventBus();
        const viewer = new pdfjsViewer.PDFViewer({
            container: viewerContainer,
            eventBus: eventBus,
            annotationEditorMode: 0, // 0: NONE
        });

        // モバイル環境での幅計算のズレを防ぐため、初期化から少し遅延させて幅を合わせる
        eventBus.on('pagesinit', () => {
            setTimeout(() => {
                viewer.currentScaleValue = 'page-width'; 
            }, 100);
        });

        window.addEventListener('resize', () => {
            if (viewer.currentScaleValue !== 'page-width') {
                viewer.currentScaleValue = 'page-width';
            }
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            originalFileName = file.name;
            statusEl.textContent = "読み込み中...";
            
            const arrayBuffer = await file.arrayBuffer();
            
            try {
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                currentPdf = await loadingTask.promise;
                
                viewer.setDocument(currentPdf);
                
                statusEl.textContent = "準備完了";
                modeNoneBtn.disabled = false;
                modeInkBtn.disabled = false;
                saveBtn.disabled = false;
            } catch (error) {
                statusEl.textContent = "エラー: " + error.message;
            }
        });

        modeNoneBtn.addEventListener('click', () => {
            viewerContainer.classList.remove('drawing-mode');
            eventBus.dispatch('switchannotationeditormode', { source: window, mode: 0 }); // 0: NONE
            statusEl.textContent = "モード: 閲覧・スクロール (描画不可)";
        });

        modeInkBtn.addEventListener('click', () => {
            viewerContainer.classList.add('drawing-mode');
            // 【重要】PDF.js v4+ における INK (ペン) ツールの正しい値は "4"
            eventBus.dispatch('switchannotationeditormode', { source: window, mode: 4 }); 
            statusEl.textContent = "モード: ペン (スクロールロック中)";
        });

        saveBtn.addEventListener('click', async () => {
            if (!currentPdf) return;
            statusEl.textContent = "保存処理中...";
            
            try {
                const bytes = await currentPdf.saveDocument();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'edited_' + originalFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                statusEl.textContent = "保存完了 (※続けて編集する場合は再読み込み推奨)";
            } catch (error) {
                statusEl.textContent = "保存エラー: " + error.message;
            }
        });
    </script>
</body>
</html>
